# Cloudflare Pages configuration.
#
# Only `public/` is uploaded, so anything a build machine writes at the repo
# root — node_modules, caches — can never be mistaken for a site asset.
#
# TOML rejects a duplicate key, and a file that fails to parse is ignored
# wholesale: wrangler then reports `pages_build_output_dir` as missing even
# though it is written below. So there is exactly one `name` and exactly one
# `pages_build_output_dir` here — edit these lines in place, never append.
#
# `name` must match the Cloudflare Pages project this deploys to.

name = "artresidencymoident"
pages_build_output_dir = "public"
