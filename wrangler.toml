# Cloudflare Workers configuration — a static-assets Worker.
#
# This project builds through Workers Builds, whose deploy command is
# `npx wrangler deploy`. That is the Workers command, so the config has to be
# a Workers config: `[assets]` below, not `pages_build_output_dir`. The two are
# mutually exclusive — wrangler picks the project type from whichever it finds,
# and the Pages key made `wrangler deploy` refuse to run.
#
# There is no Worker script, so no `main`. Only `public/` is uploaded, which
# keeps anything a build machine writes at the repo root — node_modules,
# caches — out of the deployment.
#
# TOML rejects a duplicate key and a file that fails to parse is ignored
# wholesale, so edit these values in place rather than appending new ones.
#
# `name` must match the Cloudflare project this deploys to.

name = "artresidencymoident"
compatibility_date = "2026-08-05"

[assets]
directory = "./public"
